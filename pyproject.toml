[project]
name = "savefile"
version = "0.2.0"
description = "Take backup copies of files/directories with timestamp and username as suffix"
readme = "README.md"
authors = [
    { name = "Michael Hooreman", email = "mhooreman@icloud.com" }
]
requires-python = ">=3.14"
dependencies = [
    "click>=8.5.0",
    "loguru>=0.7.3",
]

[project.scripts]
savefile = "savefile.cli:main"

[build-system]
requires = ["uv_build>=0.11.24,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 79  # pep8
preview = true  # Needed if you want to evable CPY DOC and/or FAST
include = ["pyproject.toml", "src/**/*.py", ]

[tool.ruff.lint.per-file-ignores]
"tests/*" = [
    "assert",  # Pytest uses assert
    "ANN",  # Not needed to annotate
    "redefined-while-unused",  # Fixtures not compatible with that
    "unused-import",  # Fixtures not compatible with that
    "D",   # No need to document test api
]

[tool.ruff.lint]
dummy-variable-rgx = "^_$"  #  Only ignore variables named "_"
task-tags = ["TODO", ]  # XXX and FIXME are discouraged by some rules
select = [
    "N",       # pep8-naming
    "D",       # pydocstyle
    "F",       # Pyflakes
    "E",       # E/W pycodestyle
    "W",       # E/W pycodestyle
    "C90",     # mccabe
    "I",       # isort
    "UP",      # pyupgrade
    "YTT",     # flake8-2020
    "ANN",     # flake8-annotations
    "ASYNC",   # flake8-async
    "S",       # flake8-bandit
    "BLE",     # flake8-blind-except
    "FBT",     # flake8-boolean-trap
    "B",       # flake8-bugbear
    "A",       # flake8-builtins
    "COM",     # flake8-commas
    "C4",      # flake8-comprehensions
    "DTZ",     # flake8-datetimez
    "T10",     # flake8-debugger
    "DJ",      # flake8-django
    "EM",      # flake8-errmsg
    "EXE",     # flake8-executable
    "FA",      # flake8-future-annotations
    "ISC",     # flake8-implicit-str-concat
    "ICN",     # flake8-import-conventions
    "LOG",     # flake8-logging
    "G",       # flake8-logging-format
    "INP",     # flake8-no-pep420
    "PIE",     # flake8-pie
    "T20",     # flake8-print
    "PYI",     # flake8-pyi
    "PT",      # flake8-pytest-style
    "Q",       # flake8-quotes
    "RSE",     # flake8-raise
    "RET",     # flake8-return
    "SLF",     # flake8-self
    "SLOT",    # flake8-slots
    "SIM",     # flake8-simplify
    "TID",     # flake8-tidy-imports
    "TCH",     # flake8-type-checking
    "INT",     # flake8-gettext
    "ARG",     # flake8-unused-arguments
    "PTH",     # flake8-use-pathlib
    "TD",      # flake8-todos
    "FIX",     # flake8-fixme
    "ERA",     # eradicate
    "PD",      # pandas-vet
    "PGH",     # pygrep-hooks
    "PL",      # Pylint
    "TRY",     # tryceratops
    "FLY",     # flynt
    "NPY",     # NumPy-specific rules
    "AIR",     # Airflow
    "PERF",    # Perflint
    "FURB",    # refurb
    "RUF",     # Ruff-specific rules
    "CPY",     # flake8-copyright - only in preview mode
    "FAST",    # FastAPI - only in preview mode
    "DOC",     # pydoclint - only in preview mode
]
ignore = [
    # Not a problem IMHO
    "relative-imports",

    # Too much for some cases
    "docstring-missing-returns",

    # OK with loguru
    "logging-f-string",

    # Bad detection using numpy docstring
    "docstring-missing-yields",
    
    # False positive because of standard library replacement
    "suspicious-pycrypto-import",    # replaced pycrpyto by pycryptodome
    
    # Those ones makes conflict
    "incorrect-blank-line-before-class",    # We prefer D211
    "multi-line-summary-second-line",    # We prefer D212
    "missing-trailing-comma",  #
    "single-line-implicit-string-concatenation",  #
    
    # Disabled as it doesn't agree with mypy
    "non-pep695-type-alias",   # `TypeAlias` annotation not yet supported by mypy
    
    # We don't agree
    "missing-section-name-colon",    # Since we use underlining for sections, we don't want column
    "pandas-use-of-dot-pivot-or-unstack",   # Replace unstack by pivot_table
    "missing-copyright-notice",  # No copyright at the beginning of a file
    "call-datetime-now-without-tzinfo",  # Missing time zone info when reading time
    "call-date-today",  # datetime.date.today() used
    "pandas-use-of-inplace-argument",   # Pandas inplace should be avoided. I don't agree.
    "meta-class-abc-meta", # Accept metaclass=abc.ABCMeta, we consider it as good idea.
    
    # No issue tracking system, so no refernce in the TODO marks
    "missing-todo-author",
    "missing-todo-link",
    "missing-todo-colon",
    "missing-todo-description",
]


[tool.mypy]
strict = true
show_error_context = true
show_column_numbers = true
show_error_end = true
show_error_code_links = true
pretty = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/src"
packages = ["savefile", ]

[dependency-groups]
dev = [
    "loguru-mypy>=0.0.4",
    "mypy>=2.3.1",
    "ruff>=0.16.5",
    "types-click>=7.1.8",
]
